name: Sync from iCommerce releases

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-icommerce-release
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/checkout@v6
        with:
          repository: stateset/stateset-icommerce
          path: upstream
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '20.20.0'
      - name: Generate from the latest CLI release
        id: release
        run: |
          tag=$(git -C upstream tag --list 'cli-v*' --sort=-version:refname | head -n 1)
          test -n "$tag"
          version=${tag#cli-v}
          current=$(node -p "require('./manifest.json').version")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$current" = "$version" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Plugin already tracks $tag"
            exit 0
          fi
          git -C upstream checkout "$tag"
          node upstream/scripts/package-omarchy-plugin.mjs --output "$RUNNER_TEMP/plugin"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Replace generated files
        if: steps.release.outputs.changed == 'true'
        run: |
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'CONTRIBUTING.md' \
            --exclude 'ARCHITECTURE.md' \
            --exclude 'UPSTREAM.md' \
            --exclude 'patches/' \
            --exclude 'preview.png' \
            --exclude 'preview.svg' \
            --exclude 'scripts/' \
            --exclude 'test/' \
            --exclude 'upstream/' \
            "$RUNNER_TEMP/plugin/" ./
      - name: Validate generated release
        if: steps.release.outputs.changed == 'true'
        env:
          OMARCHY_REVISION: f99d33a8ddee7b36509a71a6d20d5d23355ce8b1
        run: |
          node --test test/*.test.js
          git diff --check
          git clone --filter=blob:none https://github.com/omacom/omarchy.git "$RUNNER_TEMP/omarchy"
          git -C "$RUNNER_TEMP/omarchy" checkout "$OMARCHY_REVISION"
          "$RUNNER_TEMP/omarchy/bin/omarchy-plugin-validate" .
          cp Model.js Panel.qml README.md Service.qml ServiceHost.js manifest.json upstream/cli/omarchy/
          node upstream/scripts/ci/check_omarchy_integration.mjs
          rm -rf upstream
          git add --all
      - name: Close superseded synchronization pull requests
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGED: ${{ steps.release.outputs.changed }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          keep=""
          if [ "$CHANGED" = "true" ]; then
            keep="sync/icommerce-v${VERSION}"
          fi
          gh pr list --state open --limit 100 --json number,headRefName \
            --jq ".[] | select(.headRefName | startswith(\"sync/icommerce-v\")) | select(.headRefName != \"$keep\") | .number" |
          while read -r pr; do
            gh pr close "$pr" --comment "Superseded by iCommerce CLI v${VERSION}."
          done
      - name: Open synchronization pull request
        if: steps.release.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if git diff --cached --quiet; then
            echo "Plugin already matches $RELEASE_TAG"
            exit 0
          fi
          branch="sync/icommerce-v${VERSION}"
          git config user.name "stateset-release-bot"
          git config user.email "release-bot@stateset.com"
          git commit -m "chore: sync iCommerce plugin v${VERSION}"
          git switch -C "$branch"
          git push --force-with-lease origin "$branch"
          if ! gh pr view "$branch" >/dev/null 2>&1; then
            gh pr create \
              --base master \
              --head "$branch" \
              --title "chore: sync iCommerce plugin v${VERSION}" \
              --body "Generated from stateset/stateset-icommerce release tag ${RELEASE_TAG}. Merge after the Omarchy validation check passes."
          fi

name: Validate Omarchy plugin

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '20.20.0'
      - name: Reject symbolic links
        run: test -z "$(find . -type l -print -quit)"
      - name: Run unit tests
        run: node --test
      - name: Validate deterministic demo
        run: |
          bash -n demo/run scripts/export-to-upstream.sh
          ./demo/run --check
      - name: Check manifest and whitespace
        run: |
          node -e "JSON.parse(require('node:fs').readFileSync('manifest.json', 'utf8'))"
          if git grep -nI -E '[[:blank:]]+$' -- .; then
            echo "Trailing whitespace found" >&2
            exit 1
          fi
      - name: Validate against pinned Omarchy
        env:
          OMARCHY_REVISION: f99d33a8ddee7b36509a71a6d20d5d23355ce8b1
        run: |
          git clone --filter=blob:none https://github.com/basecamp/omarchy.git "$RUNNER_TEMP/omarchy"
          git -C "$RUNNER_TEMP/omarchy" checkout "$OMARCHY_REVISION"
          "$RUNNER_TEMP/omarchy/bin/omarchy-plugin-validate" .

  qml:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: archlinux:base
    steps:
      - name: Install QML tooling
        run: pacman -Syu --noconfirm git qt6-declarative
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Parse QML entry points
        run: |
          /usr/lib/qt6/bin/qmlformat --ignore-settings -w 2 Panel.qml >/dev/null
          /usr/lib/qt6/bin/qmlformat --ignore-settings -w 2 Service.qml >/dev/null
      - name: Run QML static analysis
        env:
          OMARCHY_REVISION: f99d33a8ddee7b36509a71a6d20d5d23355ce8b1
        run: |
          git clone --filter=blob:none https://github.com/omacom/omarchy.git "$RUNNER_TEMP/omarchy"
          git -C "$RUNNER_TEMP/omarchy" checkout "$OMARCHY_REVISION"
          # Third-party Quickshell and qs modules do not ship qmltypes metadata,
          # so disable only diagnostics that require those external types. All
          # remaining analyzable warning classes have a strict zero budget.
          /usr/lib/qt6/bin/qmllint --max-warnings 0 \
            --import disable \
            --unresolved-type disable \
            --missing-type disable \
            --missing-property disable \
            --unqualified disable \
            --inheritance-cycle disable \
            --json "$RUNNER_TEMP/qmllint.json" \
            -I "$RUNNER_TEMP/omarchy/shell" Panel.qml Service.qml
      - name: Execute QML service tests
        run: |
          QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software \
            /usr/lib/qt6/bin/qmltestrunner \
              -input test/qml \
              -import test/qml/imports \
              -o -,txt
